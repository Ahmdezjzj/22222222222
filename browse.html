<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تصفح المانجا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#e63946;--primary2:#ff6b6b;--bg:#0a0a0f;--surface:#111118;--card:#16161f;--card2:#1a1a25;--border:#1e1e2e;--border2:#252535;--text:#e8e8f0;--text2:#a0a0b8;--muted:#6b6b85;--radius:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;background:rgba(10,10,15,0.95);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;padding:0 20px;gap:12px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--primary2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.nav-logo-text{font-family:'Cairo',sans-serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,#fff 30%,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-links{display:flex;gap:4px;margin-right:auto;}
.nav-links a{color:var(--text2);text-decoration:none;font-size:14px;font-weight:500;padding:7px 12px;border-radius:8px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--surface);}

.page-header{margin-top:64px;padding:32px 24px 0;max-width:1400px;margin-left:auto;margin-right:auto;}
.page-title{font-family:'Cairo',sans-serif;font-size:28px;font-weight:900;margin-bottom:6px;}
.page-subtitle{color:var(--muted);font-size:14px;}

.filters-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;position:sticky;top:64px;z-index:50;}
.filters-inner{max-width:1400px;margin:0 auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}

.filter-group{display:flex;align-items:center;gap:8px;}
.filter-label{font-size:13px;color:var(--muted);white-space:nowrap;}
.filter-select{padding:8px 12px;background:var(--card);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;outline:none;cursor:pointer;}
.filter-select:focus{border-color:var(--primary);}
.search-input{flex:1;min-width:200px;padding:9px 14px;background:var(--card);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;}
.search-input:focus{border-color:var(--primary);}
.search-input::placeholder{color:var(--muted);}
.reset-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px;transition:all 0.2s;}
.reset-btn:hover{border-color:var(--primary);color:var(--primary);}

.main{max-width:1400px;margin:0 auto;padding:24px 16px 80px;}

.results-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:14px;color:var(--muted);}
.results-count strong{color:var(--text);}

.manga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
@media(max-width:480px){.manga-grid{grid-template-columns:repeat(3,1fr);gap:10px;}}

.manga-card{border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all 0.3s;text-decoration:none;color:inherit;display:block;}
.manga-card:hover{transform:translateY(-6px);border-color:var(--primary);box-shadow:0 16px 40px rgba(0,0,0,0.5),0 0 0 1px rgba(230,57,70,0.3);}
.manga-cover-wrap{position:relative;aspect-ratio:2/3;overflow:hidden;}
.manga-cover{width:100%;height:100%;object-fit:cover;transition:transform 0.4s;}
.manga-card:hover .manga-cover{transform:scale(1.06);}
.manga-cover-ph{width:100%;height:100%;background:linear-gradient(135deg,var(--surface),var(--border));display:flex;align-items:center;justify-content:center;font-size:40px;}
.manga-badge{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;}
.badge-hot{background:linear-gradient(135deg,#ff912b,#ffb800);color:#000;}
.badge-new{background:linear-gradient(135deg,#56ccf2,#2f80ed);color:#fff;}
.manga-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.8) 0%,transparent 50%);opacity:0;transition:opacity 0.3s;}
.manga-card:hover .manga-overlay{opacity:1;}
.manga-quick{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) translateY(10px);opacity:0;transition:all 0.3s;white-space:nowrap;font-size:12px;font-weight:700;padding:6px 14px;background:var(--primary);color:white;border-radius:50px;}
.manga-card:hover .manga-quick{opacity:1;transform:translateX(-50%) translateY(0);}
.manga-info{padding:10px;}
.manga-title{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.manga-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}
.manga-ch{color:var(--primary);font-weight:700;}
.manga-type{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;background:var(--surface);}

.loading{display:flex;justify-content:center;padding:60px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:80px 20px;color:var(--muted);}
.empty-icon{font-size:56px;margin-bottom:16px;}

.load-more-btn{display:block;margin:32px auto 0;padding:12px 40px;background:var(--card);border:1px solid var(--border2);border-radius:50px;color:var(--text2);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.load-more-btn:hover{border-color:var(--primary);color:var(--primary);}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(13,13,20,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 0;justify-content:space-around;}
@media(max-width:768px){.mobile-nav{display:flex;}body{padding-bottom:70px;}.nav-links{display:none;}.filters-inner{gap:8px;}}
.mob-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:600;}
.mob-nav-item.active{color:var(--primary);}
.mob-nav-item span:first-child{font-size:20px;}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">
    <div class="nav-logo-icon">⚡</div>
    <span class="nav-logo-text" id="siteName">مانجا كلاود</span>
  </a>
  <div class="nav-links">
    <a href="/">الرئيسية</a>
    <a href="/browse.html" class="active">تصفح</a>
    <a href="/browse.html?type=manga">مانجا</a>
    <a href="/browse.html?type=manhwa">مانهوا</a>
    <a href="/browse.html?type=manhua">مانهوا صينية</a>
  </div>
</nav>

<div class="page-header">
  <h1 class="page-title">📚 تصفح المانجا</h1>
  <p class="page-subtitle" id="pageSubtitle">تصفح كامل مكتبة المانجا والمانهوا</p>
</div>

<div class="filters-bar">
  <div class="filters-inner">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث عن مانجا...">
    <div class="filter-group">
      <span class="filter-label">النوع</span>
      <select class="filter-select" id="typeFilter" onchange="applyFilters()">
        <option value="">الكل</option>
        <option value="manhwa">مانهوا 🇰🇷</option>
        <option value="manga">مانجا 🇯🇵</option>
        <option value="manhua">مانهوا صينية 🇨🇳</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">الحالة</span>
      <select class="filter-select" id="statusFilter" onchange="applyFilters()">
        <option value="">الكل</option>
        <option value="ongoing">مستمر</option>
        <option value="completed">مكتمل</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">التصنيف</span>
      <select class="filter-select" id="genreFilter" onchange="applyFilters()">
        <option value="">الكل</option>
        <option value="أكشن">أكشن</option>
        <option value="رومانسي">رومانسي</option>
        <option value="فانتازيا">فانتازيا</option>
        <option value="إثارة">إثارة</option>
        <option value="كوميديا">كوميديا</option>
        <option value="رعب">رعب</option>
        <option value="دراما">دراما</option>
        <option value="خيال علمي">خيال علمي</option>
        <option value="مغامرة">مغامرة</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">ترتيب</span>
      <select class="filter-select" id="sortFilter" onchange="applyFilters()">
        <option value="updated">الأحدث</option>
        <option value="views">الأكثر مشاهدة</option>
        <option value="rating">الأعلى تقييماً</option>
        <option value="new">الأجدد إضافة</option>
        <option value="az">أ-ي</option>
      </select>
    </div>
    <button class="reset-btn" onclick="resetFilters()">↺ إعادة تعيين</button>
  </div>
</div>

<div class="main">
  <div class="results-info">
    <span class="results-count" id="resultsCount"></span>
  </div>
  <div class="manga-grid" id="mangaGrid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>
  <button class="load-more-btn" id="loadMoreBtn" style="display:none" onclick="loadMore()">تحميل المزيد</button>
</div>

<div class="mobile-nav">
  <a href="/" class="mob-nav-item"><span>🏠</span><span>الرئيسية</span></a>
  <a href="/browse.html" class="mob-nav-item active"><span>📚</span><span>تصفح</span></a>
  <a href="/browse.html?sort=views" class="mob-nav-item"><span>🔥</span><span>شائع</span></a>
</div>

<script>
let page = 1;
let total = 0;
let searchTimer = null;

function getFilters() {
  return {
    search: document.getElementById('searchInput').value.trim(),
    type: document.getElementById('typeFilter').value,
    status: document.getElementById('statusFilter').value,
    genre: document.getElementById('genreFilter').value,
    sort: document.getElementById('sortFilter').value,
  };
}

async function init() {
  await loadSettings();

  // تطبيق URL params
  const p = new URLSearchParams(location.search);
  if (p.get('type')) document.getElementById('typeFilter').value = p.get('type');
  if (p.get('sort')) document.getElementById('sortFilter').value = p.get('sort');
  if (p.get('genre')) document.getElementById('genreFilter').value = p.get('genre');
  if (p.get('search')) document.getElementById('searchInput').value = p.get('search');

  loadManga(true);
}

async function loadSettings() {
  try {
    const s = await api('/api/settings');
    if (s.site_name) document.getElementById('siteName').textContent = s.site_name;
    if (s.primary_color) document.documentElement.style.setProperty('--primary', s.primary_color);
    if (s.secondary_color) document.documentElement.style.setProperty('--primary2', s.secondary_color);
    if (s.bg_color) document.documentElement.style.setProperty('--bg', s.bg_color);
    if (s.card_color) document.documentElement.style.setProperty('--card', s.card_color);
  } catch(e) {}
}

async function loadManga(reset = false) {
  if (reset) page = 1;
  const f = getFilters();
  const params = new URLSearchParams({ page, limit: 24, ...f });

  try {
    const data = await api(`/api/manga?${params}`);
    const grid = document.getElementById('mangaGrid');
    total = data.total || 0;

    document.getElementById('resultsCount').innerHTML = `عرض <strong>${Math.min(page*24, total)}</strong> من <strong>${total}</strong> نتيجة`;

    if (page === 1) {
      if (!data.manga?.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><h3>لا توجد نتائج</h3><p>جرب تغيير معايير البحث</p></div>`;
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }
      grid.innerHTML = '';
    }

    grid.insertAdjacentHTML('beforeend', (data.manga || []).map(m => `
      <a href="/manga.html?slug=${m.slug}" class="manga-card">
        <div class="manga-cover-wrap">
          ${m.cover ? `<img src="${m.cover}" class="manga-cover" alt="${m.title}" loading="lazy">` : `<div class="manga-cover-ph">📖</div>`}
          ${m.is_hot ? '<div class="manga-badge badge-hot">🔥</div>' : ''}
          ${m.is_new && !m.is_hot ? '<div class="manga-badge badge-new">جديد</div>' : ''}
          <div class="manga-overlay"></div>
          <div class="manga-quick">📖 اقرأ</div>
        </div>
        <div class="manga-info">
          <div class="manga-title">${m.title}</div>
          <div class="manga-meta">
            <span class="manga-ch">📑 ${m.last_chapter || 0}</span>
            <span class="manga-type">${typeLabel(m.type)}</span>
          </div>
        </div>
      </a>
    `).join(''));

    document.getElementById('loadMoreBtn').style.display = page * 24 < total ? 'block' : 'none';
  } catch(e) {
    document.getElementById('mangaGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">❌</div><h3>خطأ في التحميل</h3></div>';
  }
}

function applyFilters() {
  loadManga(true);
}

function loadMore() { page++; loadManga(false); }

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('typeFilter').value = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('genreFilter').value = '';
  document.getElementById('sortFilter').value = 'updated';
  loadManga(true);
}

document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadManga(true), 400);
});

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function typeLabel(t) {
  return {manga:'🇯🇵',manhwa:'🇰🇷',manhua:'🇨🇳'}[t] || '📖';
}

init();
</script>
</body>
</html>
